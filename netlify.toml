[build]
  command = "npm run build"
  publish = "dist"

# The résumé and the retained SalehOS project share the React entry point.
[[redirects]]
  from = "/os"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/os/"
  to = "/index.html"
  status = 200

# Long-cache immutable assets (hashed filenames) and the big game bundles.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jsdos"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
