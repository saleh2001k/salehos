    <meta name="theme-color" content="#f4f4f3" />
    <script>
      // Résumé theme before first paint: saved choice, else the system's.
      (function () {
        if (/^\/os\/?$/.test(location.pathname)) return;
        var t;
        try { t = localStorage.getItem("portfolio-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0a0a");
      })();
    </script>
